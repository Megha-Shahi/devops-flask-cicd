apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-flask-app
  template:
    metadata:
      labels:
        app: devops-flask-app
    spec:
      containers:
        - name: devops-flask-app
          image: meghashahi/devops-flask-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
